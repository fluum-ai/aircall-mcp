services:
  aircall-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AIRCALL_API_ID: ${AIRCALL_API_ID}
      AIRCALL_API_TOKEN: ${AIRCALL_API_TOKEN}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: "8000"
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      coolify:
        aliases:
          - aircall-mcp

networks:
  coolify:
    external: true
